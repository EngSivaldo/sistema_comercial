{% extends 'base.html' %}

{% block title %}Editar Usuário - SGC{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white py-3">
                    <h5 class="mb-0 fw-bold">✏️ Editar Cadastro de Usuário</h5>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('usuario.editar_usuario', id=usuario.id) }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        
                        <div class="mb-3">
                            <label for="nome_completo" class="form-label fw-bold text-secondary">Nome Completo</label>
                            <input type="text" class="form-control" id="nome_completo" name="nome_completo" value="{{ usuario.nome_completo }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold text-secondary">Nome de Usuário (Login)</label>
                            <input type="text" class="form-control" id="username" name="username" value="{{ usuario.username }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="senha" class="form-label fw-bold text-secondary">Nova Senha de Acesso</label>
                            <input type="password" class="form-control" id="senha" name="senha" placeholder="Deixe em branco para manter a senha atual">
                            <div class="form-text text-muted small">Preencha este campo apenas se desejar redefinir a senha do usuário.</div>
                        </div>

                        <div class="mb-3">
                            <label for="role" class="form-label fw-bold text-secondary">Nível de Permissão</label>
                            <select class="form-select" id="role" name="role">
                                <option value="operador" {% if usuario.role == 'operador' %}selected{% endif %}>Operador de Caixa (Acesso Restrito)</option>
                                <option value="administrador" {% if usuario.role == 'administrador' %}selected{% endif %}>Administrador (Acesso Total)</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="ativo" class="form-label fw-bold text-secondary">Status da Conta</label>
                            <select class="form-select" id="ativo" name="ativo">
                                <option value="true" {% if usuario.ativo %}selected{% endif %}>🟢 Ativo (Acesso Liberado)</option>
                                <option value="false" {% if not usuario.ativo %}selected{% endif %}>🔴 Inativo (Bloquear Acesso)</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-2">
                            <a href="{{ url_for('usuario.listar_usuarios') }}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-dark fw-bold px-4">Salvar Alterações</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
