{% extends 'base.html' %}

{% block title %}Cadastrar Usuário - SGC{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0 fw-bold">👤 Cadastrar Novo Usuário / Funcionário</h5>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('usuario.cadastrar_usuario') }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="nome_completo" class="form-label fw-bold text-secondary">Nome Completo</label>
                            <input type="text" class="form-control" id="nome_completo" name="nome_completo" placeholder="Ex: João Silva" required>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold text-secondary">Nome de Usuário (Login)</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Ex: joao.silva" required>
                            <div class="form-text">Este nome será usado para acessar o sistema.</div>
                        </div>

                        <div class="mb-3">
                            <label for="senha" class="form-label fw-bold text-secondary">Senha de Acesso</label>
                            <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite uma senha segura" required>
                        </div>

                        <div class="mb-4">
                            <label for="role" class="form-label fw-bold text-secondary">Nível de Permissão</label>
                            <select class="form-select" id="role" name="role">
                                <option value="operador" selected>Operador de Caixa (Acesso Restrito)</option>
                                <option value="administrador">Administrador (Acesso Total)</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-2">
                            <a href="{{ url_for('usuario.listar_usuarios') }}" class="btn btn-outline-secondary">Voltar à Lista</a>
                            <button type="submit" class="btn btn-primary fw-bold px-4">Salvar Usuário</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
