{% extends 'base.html' %}

{% block title %}Cadastrar Usuário - SGC{% endblock %}

{% block styles %}
<style>
    /* Estilização de Cartões de Formulário */
    .form-card {
        border-radius: 12px !important;
        border: 1px solid #e2e8f0 !important;
        background-color: #ffffff;
    }

    /* Customização sutil de inputs corporativos */
    .form-control, .form-select {
        border-radius: 8px !important;
        border: 1px solid #cbd5e1 !important;
        padding: 0.625rem 0.75rem !important;
        color: #334155 !important;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    .form-control:focus, .form-select:focus {
        border-color: #1e3a8a !important;
        box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1) !important;
        outline: 0;
    }

    .form-label {
        font-size: 0.875rem !important;
        font-weight: 600 !important;
        color: #475569 !important;
        margin-bottom: 0.5rem !important;
    }

    /* Botões Customizados */
    .btn-submit {
        background-color: #1e3a8a !important;
        border-color: #1e3a8a !important;
        color: #ffffff !important;
        border-radius: 8px !important;
        padding: 0.625rem 1.25rem !important;
        transition: all 0.2s;
    }

    .btn-submit:hover {
        background-color: #1e40af !important;
        border-color: #1e40af !important;
    }

    .btn-cancel {
        border-radius: 8px !important;
        padding: 0.625rem 1.25rem !important;
        border: 1px solid #cbd5e1 !important;
        color: #475569 !important;
        background-color: #ffffff;
    }
    
    .btn-cancel:hover {
        background-color: #f1f5f9 !important;
        color: #1e293b !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            
            <div class="card form-card shadow-sm">
                <div class="card-body p-4 p-sm-5">
                    
                    <div class="mb-4 pb-3 border-bottom border-light">
                        <h4 class="fw-bold text-dark mb-1" style="letter-spacing: -0.5px;">
                            <i class="fa-solid fa-user-plus text-secondary me-2 fs-5"></i>Novo Colaborador
                        </h4>
                        <p class="text-secondary small mb-0">Insira as credenciais de acesso e defina o nível de permissão no sistema.</p>
                    </div>

                    <form action="{{ url_for('usuario.cadastrar_usuario') }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        
                        <div class="mb-3">
                            <label for="nome_completo" class="form-label">Nome Completo</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-secondary border-end-0" style="border-radius: 8px 0 0 8px;"><i class="fa-solid fa-id-card small"></i></span>
                                <input type="text" class="form-control border-start-0" id="nome_completo" name="nome_completo" placeholder="Ex: João Silva" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label">Nome de Usuário (Login)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-secondary border-end-0" style="border-radius: 8px 0 0 8px;"><i class="fa-solid fa-at small"></i></span>
                                <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="Ex: joao.silva" required>
                            </div>
                            <div class="form-text text-muted fs-7 mt-1">Este identificador será único para o login.</div>
                        </div>

                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha de Acesso</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-secondary border-end-0" style="border-radius: 8px 0 0 8px;"><i class="fa-solid fa-key small"></i></span>
                                <input type="password" class="form-control border-start-0" id="senha" name="senha" placeholder="Crie uma senha segura" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="role" class="form-label">Nível de Permissão Administrativa</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-secondary border-end-0" style="border-radius: 8px 0 0 8px;"><i class="fa-solid fa-sliders small"></i></span>
                                <select class="form-select border-start-0" id="role" name="role">
                                    <option value="operador" selected>🪪 Operador de Caixa (Acesso Operacional)</option>
                                    <option value="administrador">🛡️ Administrador (Acesso Total / Configurações)</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-2 gap-2">
                            <a href="{{ url_for('usuario.listar_usuarios') }}" class="btn btn-cancel fw-semibold small">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-submit fw-semibold small px-4">
                                Salvar Usuário
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
